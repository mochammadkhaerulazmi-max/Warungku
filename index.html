<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WarungKu</title>
<meta name="theme-color" content="#1E8E55">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --bg:#F6FAF7; --surface:#FFFFFF; --surface-2:#EEF4F0; --surface-raised:#FFFFFF;
  --ink:#15231B; --muted:#5E7266; --line:#DCE6E0;
  --accent:#1E8E55; --accent-ink:#FFFFFF; --accent-soft:#E3F3E9;
  --warn:#B9690A; --warn-soft:#FBEBD7; --danger:#C33636; --danger-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(21,35,27,.06),0 4px 16px rgba(21,35,27,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1510; --surface:#16211B; --surface-2:#1C2922; --surface-raised:#1C2922;
    --ink:#E8F1EA; --muted:#92A698; --line:#24352B;
    --accent:#3FCB80; --accent-ink:#06130C; --accent-soft:#17341F;
    --warn:#E0962E; --warn-soft:#2E2213; --danger:#E2676A; --danger-soft:#331818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1510; --surface:#16211B; --surface-2:#1C2922; --surface-raised:#1C2922;
  --ink:#E8F1EA; --muted:#92A698; --line:#24352B;
  --accent:#3FCB80; --accent-ink:#06130C; --accent-soft:#17341F;
  --warn:#E0962E; --warn-soft:#2E2213; --danger:#E2676A; --danger-soft:#331818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance}
.tabular{font-variant-numeric:tabular-nums}
#app{display:flex; flex-direction:column; height:100%}

header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:10px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
header .store-name{font-family:var(--font-display); font-weight:800; font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
header .icon-btn{margin-left:auto}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex:none;position:relative;cursor:pointer;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn.scan-icon-btn svg{width:23px;height:23px}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--surface)}

main{flex:1; overflow-y:auto; padding:16px max(16px,env(safe-area-inset-left,0px)) 100px max(16px,env(safe-area-inset-right,0px)); -webkit-overflow-scrolling:touch}
main.no-pad-bottom{padding-bottom:16px}

nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));
  display:flex; gap:4px;
}
nav.tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none;border:none;padding:8px 4px;border-radius:12px;color:var(--muted);cursor:pointer;position:relative;
}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button span{font-size:11px;font-weight:600}
nav.tabbar button.active{color:var(--accent)}
nav.tabbar button .nav-dot{position:absolute;top:2px;right:22%;width:8px;height:8px;border-radius:5px;background:var(--danger);border:2px solid var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;font-size:15px;
  padding:10px 16px;cursor:pointer;width:100%;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;font-size:13px;padding:8px 12px;width:auto}
input[type=text],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:0 14px;font-size:16px;
}
textarea{padding:12px 14px;min-height:80px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:42px;padding-right:48px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.scan-btn{position:absolute;right:6px;top:6px;bottom:6px;width:40px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scan-btn svg{width:24px;height:24px;stroke-width:2.4}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.big-number{font-family:var(--font-display);font-weight:800;font-size:26px}
hr.sep{border:none;border-top:1px solid var(--line);margin:4px 0}

.grid-products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;position:relative;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.ptile .avatar{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);margin-bottom:8px}
.ptile .pname{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .pprice{font-weight:700;color:var(--accent);font-size:13px;margin-top:6px}
.ptile .lowstock{position:absolute;top:10px;right:10px}

.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.cartbar-inner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);cursor:pointer}
.cartbar-inner .count{background:rgba(255,255,255,.25);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}

#sheetRoot{position:fixed;inset:0;z-index:30;pointer-events:none}
.sheet-overlay{position:absolute;inset:0;background:rgba(10,18,13,.45);opacity:0;transition:opacity .18s}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:var(--surface);
  border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform .2s ease;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -4px 24px rgba(0,0,0,.2);
}
#sheetRoot.open{pointer-events:auto}
#sheetRoot.open .sheet-overlay{opacity:1}
#sheetRoot.open .sheet{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none}
.sheet-head h2{font-size:18px;flex:1}
.sheet-body{overflow-y:auto;flex:1}
.sheet-foot{flex:none;padding-top:12px}

.chartwrap{overflow-x:auto}
svg text{font-family:var(--font-body)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* fullscreen scanner */
#scanOverlay{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#scanOverlay.open{display:flex}
#scanOverlay video{flex:1;width:100%;object-fit:cover;background:#000}
#scanOverlay .scan-frame{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:70%;max-width:320px;aspect-ratio:5/3;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanOverlay .scan-top{position:absolute;top:0;left:0;right:0;padding:16px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;z-index:2}
#scanOverlay .scan-top button{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.5);border:none;color:#fff;display:flex;align-items:center;justify-content:center}
#scanOverlay .scan-hint{position:absolute;bottom:max(40px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-weight:600;padding:0 24px}

/* auth screen */
.auth-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px}
.auth-logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.auth-logo svg{width:34px;height:34px;color:#fff}

/* role badge */
.role-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

@media (prefers-reduced-motion:reduce){ *{transition-duration:0.001ms!important; animation-duration:0.001ms!important} }
</style>
</head>
